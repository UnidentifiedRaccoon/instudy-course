<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Просмотр документа</title><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="reader.css"></head><body>
<p id="status" role="status">Открываем документ…</p>
<main id="viewport" tabindex="0" aria-label="Страницы документа"><div id="sheet"><canvas aria-label="Страница документа"></canvas><div class="textLayer"></div></div></main>
<footer class="toolbar"><button id="prev" aria-label="Предыдущая страница" title="Предыдущая страница"><span data-icon="back"></span></button><button id="pageCounter" aria-label="Перейти к странице" title="Перейти к странице" aria-expanded="false" aria-controls="pageJump">1 / …</button><button id="next" aria-label="Следующая страница" title="Следующая страница"><span data-icon="forward"></span></button><button id="resetZoom" hidden>Сбросить масштаб</button>
<form id="pageJump" hidden><label for="page">Страница</label><input id="page" type="number" min="1" value="1" inputmode="numeric" required><button type="submit">Перейти</button><button type="button" id="cancelJump" aria-label="Закрыть переход к странице"><span data-icon="close"></span></button></form>
</footer><script src="icons.js"></script><script type="module" src="reader.js"></script></body></html>
